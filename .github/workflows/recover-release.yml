name: recover release packaging

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag to package
        required: true
        type: string
      source_run:
        description: Completed release run containing the successful package builds
        required: true
        type: string
      ci_run:
        description: Successful CI run for the exact tagged commit
        required: true
        type: string

concurrency:
  group: recover-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.tag }}
  SOURCE_RUN: ${{ inputs.source_run }}
  CI_RUN: ${{ inputs.ci_run }}

# Repackage the original binaries without moving the release tag or rebuilding the application.
jobs:
  bundle:
    if: github.repository == 'pelletiermaxime/sonora'
    name: repair macos app bundle
    runs-on: macos-15-intel
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - name: verify the original macOS builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          source_commit="$(git rev-parse HEAD)"
          test "$(git ls-remote origin "refs/tags/$VERSION^{}" | cut -f1)" = "$source_commit"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > original-run.json
          jq -e --arg sha "$source_commit" --arg tag "$VERSION" \
            '.head_sha == $sha and .head_branch == $tag and .path == ".github/workflows/release.yml" and .status == "completed"' original-run.json
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs?per_page=100" \
            --slurp > original-jobs.json
          jq -e '
            [.[].jobs[] | select(.conclusion == "success") | .name] as $passed |
            ["x86_64-apple-darwin", "aarch64-apple-darwin"] |
            all(. as $name | $passed | index($name) != null)
          ' original-jobs.json

      - uses: actions/download-artifact@v4
        with:
          pattern: darwin-*
          path: darwin
          merge-multiple: true
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}

      - name: assemble and sign the universal bundle
        run: |
          set -euo pipefail
          mkdir -p Sonora.app/Contents/MacOS Sonora.app/Contents/Resources
          lipo -create -output Sonora.app/Contents/MacOS/sonora \
            darwin/sonora-aarch64-apple-darwin darwin/sonora-x86_64-apple-darwin
          chmod +x Sonora.app/Contents/MacOS/sonora
          lipo Sonora.app/Contents/MacOS/sonora -verify_arch arm64 x86_64
          cp assets/macos/sonora.icns Sonora.app/Contents/Resources/
          cp COPYING Sonora.app/Contents/Resources/LICENSE
          cp THIRD-PARTY.md Sonora.app/Contents/Resources/
          cp assets/fonts/LICENSE.txt Sonora.app/Contents/Resources/LICENSE.Inter
          mkdir -p Sonora.app/Contents/Resources/icons
          cp assets/icons/LICENSE Sonora.app/Contents/Resources/icons/LICENSE
          for licence in assets/icons/*/LICENSE; do
            pack="$(basename "$(dirname "$licence")")"
            cp "$licence" "Sonora.app/Contents/Resources/icons/LICENSE.$pack"
          done
          sed "s/@VERSION@/${VERSION#v}/g" assets/macos/Info.plist > Sonora.app/Contents/Info.plist
          plutil -lint Sonora.app/Contents/Info.plist
          codesign --force --sign - Sonora.app
          codesign --verify --strict --verbose=2 Sonora.app

      - name: create the disk image
        run: |
          set -euo pipefail
          mkdir -p dist staging
          cp -R Sonora.app staging/
          ln -s /Applications staging/Applications
          megabytes=$(du -ms staging | cut -f1)
          hdiutil create -volname Sonora -srcfolder staging -size "$((megabytes + 128))m" \
            -ov -format UDZO "dist/sonora-$VERSION-macos.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/*
          if-no-files-found: error

  appimage:
    if: github.repository == 'pelletiermaxime/sonora'
    name: repair AppImage (${{ matrix.variant.arch }})
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.variant.runner }}
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
      ARCH: ${{ matrix.variant.arch }}
      TARGET: ${{ matrix.variant.target }}
      UPDATE: gh-releases-zsync|pelletiermaxime|sonora|latest|sonora-*-${{ matrix.variant.arch }}.AppImage.zsync
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - name: verify the original source and build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          source_commit="$(git rev-parse HEAD)"
          test "$(git ls-remote origin "refs/tags/$VERSION^{}" | cut -f1)" = "$source_commit"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > original-run.json
          jq -e --arg sha "$source_commit" --arg tag "$VERSION" \
            '.head_sha == $sha and .head_branch == $tag and .path == ".github/workflows/release.yml" and .status == "completed"' original-run.json
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs?per_page=100" \
            --slurp > original-jobs.json
          jq -e --arg target "$TARGET" \
            '[.[].jobs[]] | any(.name == $target and .conclusion == "success")' original-jobs.json

      - uses: actions/download-artifact@v4
        with:
          name: release-${{ matrix.variant.target }}
          path: staged
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}

      - name: system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            patchelf file desktop-file-utils \
            libasound2 libfontconfig1 libfreetype6 libsqlite3-0 \
            libx11-6 libxcb1 libxcursor1 libxi6 \
            libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 \
            libvulkan1 libdbus-1-3

      - name: fetch the AppImage tools
        run: |
          set -euo pipefail
          base=https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous
          curl -fsSL -o linuxdeploy "$base/linuxdeploy-$ARCH.AppImage"
          base=https://github.com/AppImage/appimagetool/releases/download/continuous
          curl -fsSL -o appimagetool "$base/appimagetool-$ARCH.AppImage"
          chmod +x linuxdeploy appimagetool

      - name: assemble the AppDir with a raster root icon
        run: |
          set -euo pipefail
          mkdir -p AppDir/usr/bin
          cp "staged/sonora-$VERSION-$TARGET" AppDir/usr/bin/sonora
          chmod +x AppDir/usr/bin/sonora
          mkdir -p AppDir/usr/share/icons
          cp -R assets/linux/icons/hicolor AppDir/usr/share/icons/
          mkdir -p desktop
          cp assets/linux/sonora.desktop desktop/sonora.desktop
          {
            echo "X-AppImage-Name=Sonora"
            echo "X-AppImage-Arch=$ARCH"
            echo "X-AppImage-Homepage=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            echo "X-AppImage-Version=${VERSION#v}"
            echo "X-AppImage-UpdateURL=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          } >> desktop/sonora.desktop
          desktop-file-validate desktop/sonora.desktop
          ./linuxdeploy \
            --appdir AppDir \
            --executable AppDir/usr/bin/sonora \
            --desktop-file desktop/sonora.desktop \
            --icon-file assets/linux/sonora.svg
          cp assets/linux/icons/hicolor/256x256/apps/sonora.png AppDir/sonora.png
          ln -sfn sonora.png AppDir/.DirIcon
          rm -f AppDir/usr/lib/libvulkan.so.1*
          mkdir -p AppDir/usr/share/doc/sonora/icons
          cp COPYING AppDir/usr/share/doc/sonora/LICENSE
          cp THIRD-PARTY.md AppDir/usr/share/doc/sonora/
          cp assets/fonts/LICENSE.txt AppDir/usr/share/doc/sonora/LICENSE.Inter
          cp assets/icons/LICENSE AppDir/usr/share/doc/sonora/icons/LICENSE
          for licence in assets/icons/*/LICENSE; do
            pack="$(basename "$(dirname "$licence")")"
            cp "$licence" "AppDir/usr/share/doc/sonora/icons/LICENSE.$pack"
          done

      - name: build and inspect the AppImage
        run: |
          set -euo pipefail
          mkdir -p dist
          image="sonora-$VERSION-$ARCH.AppImage"
          env -u VERSION ./appimagetool --updateinformation "$UPDATE" AppDir "dist/$image"
          if [ -f "$image.zsync" ]; then mv "$image.zsync" dist/; fi
          cd dist
          "./$image" --appimage-extract > /dev/null
          test -x squashfs-root/usr/bin/sonora
          test -f squashfs-root/sonora.png
          test -f squashfs-root/.DirIcon
          test -f squashfs-root/sonora.desktop
          grep -qx "X-AppImage-Arch=$ARCH" squashfs-root/sonora.desktop
          grep -qx "X-AppImage-Version=${VERSION#v}" squashfs-root/sonora.desktop
          test -f "$image.zsync"
          test "$(env -u APPIMAGE_EXTRACT_AND_RUN "./$image" --appimage-updateinformation)" = "$UPDATE"
          test -f squashfs-root/usr/share/doc/sonora/THIRD-PARTY.md
          test ! -e squashfs-root/usr/lib/libvulkan.so.1
          ldd squashfs-root/usr/bin/sonora
          rm -rf squashfs-root

      - uses: actions/upload-artifact@v4
        with:
          name: release-appimage-${{ matrix.variant.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [appimage, bundle]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - name: verify the original tag and all completed packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$CI_RUN" =~ ^[0-9]+$ ]]
          source_commit="$(git rev-parse HEAD)"
          test "$(git ls-remote origin "refs/tags/$VERSION^{}" | cut -f1)" = "$source_commit"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN" > ci.json
          jq -e --arg sha "$source_commit" \
            '.head_sha == $sha and .path == ".github/workflows/ci.yml"' ci.json
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN/jobs?per_page=100" \
            --slurp > ci-jobs.json
          # The release builds below already prove every native target. Require the source
          # checks too, without depending on a second copy of each native build getting a runner.
          jq -e '
            [.[].jobs[]] |
            any(.name == "fmt, clippy and tests" and .conclusion == "success") and
            all(.conclusion != "failure" and .conclusion != "timed_out")
          ' ci-jobs.json
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs?per_page=100" \
            --slurp > jobs.json
          jq -e '
            [.[].jobs[] | select(.conclusion == "success") | .name] as $passed |
            ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu",
             "x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc",
             "x86_64-apple-darwin", "aarch64-apple-darwin",
             "Flatpak (x86_64)", "Flatpak (aarch64)"] |
            all(. as $name | $passed | index($name) != null)
          ' jobs.json
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --slurp > releases.json
          jq -e --arg tag "$VERSION" 'all(.[][]; .tag_name != $tag)' releases.json

      - name: reuse the successful binaries and installers
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}

      - name: reuse the successful unsigned Flatpaks
        uses: actions/download-artifact@v4
        with:
          pattern: flatpak-*
          path: dist
          merge-multiple: true
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}

      - name: collect the repaired AppImages
        uses: actions/download-artifact@v4
        with:
          pattern: release-appimage-*
          path: dist
          merge-multiple: true

      - name: collect the repaired macOS disk image
        uses: actions/download-artifact@v4
        with:
          name: release-macos
          path: dist

      - name: stage licenses and verify the complete asset inventory
        run: |
          set -euo pipefail
          ./scripts/licenses-tarball.sh "dist/sonora-$VERSION-licenses.tar.gz"
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 14
          for arch in x86_64 aarch64; do
            for suffix in -unknown-linux-gnu -pc-windows-msvc.exe .AppImage .AppImage.zsync .flatpak; do
              test -s "dist/sonora-$VERSION-$arch$suffix"
            done
          done
          test -s dist/Sonora-Setup.exe
          test -s dist/Sonora-Setup-arm64.exe
          test -s "dist/sonora-$VERSION-macos.dmg"
          test -s "dist/sonora-$VERSION-licenses.tar.gz"
          cd dist
          shasum -a 256 * > SHA256SUMS

      - name: extract the tagged changelog notes
        run: |
          set -euo pipefail
          awk -v heading="## [${VERSION#v}]" '
            /^## / {
              if (found) exit
              if ($0 == heading || index($0, heading " - ") == 1) { found = 1; next }
            }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > notes.md
          test -s notes.md
          printf '\n[Code signing policy](https://github.com/%s#code-signing-policy)\n' "$GITHUB_REPOSITORY" >> notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: dist/*
          body_path: notes.md
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
